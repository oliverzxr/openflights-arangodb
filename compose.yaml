services:
  arangodb:
    image: arangodb:3.12.13
    environment:
      ARANGO_ROOT_PASSWORD: "${ARANGO_ROOT_PASSWORD:?Set ARANGO_ROOT_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${ARANGO_PORT:-8529}:8529"
    volumes:
      - arango-data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD-SHELL", "arangosh --server.endpoint tcp://127.0.0.1:8529 --server.username root --server.password \"$$ARANGO_ROOT_PASSWORD\" --javascript.execute-string 'db._version()' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  arango-data:
